<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mezzanine Camille</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=range]::-webkit-slider-runnable-track { background: #334155; border-radius: 10px; height: 6px; }
        input[type=range]::-webkit-slider-thumb { margin-top: -5px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-0 m-0">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [activeElement, setActiveElement] = useState(null);
            const [stairType, setStairType] = useState('rabattable'); // 'classique', 'japonais', 'bateau', 'rabattable'
            const [viewMode, setViewMode] = useState('top'); // 'top' ou 'coupe'
            const [mezzDepth, setMezzDepth] = useState(200); // Profondeur (160, 180, 200)
            const [echappee, setEchappee] = useState(200); // Echappée variable (180 à 210)

            // --- Dimensions de la pièce ---
            const L_X = 415; 
            const L_Y = 428; 
            const Y_chem = 58; 
            const Y_porte = 70; 
            const Y_faitiere = 73; 

            // --- DONNÉES STRUCTURELLES CAISSON (Poutres 100x300) ---
            const Z_bottom = 235; // Dessous bois aligné sur haut fenêtre
            const H_solivette = 11; 
            const H_poutre = 30; 
            const H_osb = 2; 
            
            const H_plancher = Z_bottom + H_solivette + H_osb; // 248 cm
            const Z_top_poutre = Z_bottom + H_poutre; // 265 cm

            // --- CALCULS ESCALIER ET TRÉMIE DYNAMIQUE ---
            // Largeurs : Classique 65, Japonais 60, Bateau 52, Rabattable 60
            const stairW = stairType === 'classique' ? 65 : (stairType === 'japonais' ? 60 : (stairType === 'bateau' ? 52 : 60)); 
            
            // Recul total au sol (Palier + Projection DZ)
            const stairL = stairType === 'classique' ? 206 : (stairType === 'japonais' ? 142 : (stairType === 'bateau' ? 144 : 160)); 
            
            const flightRun = stairL - stairW;
            const flightH = (stairType === 'classique' || stairType === 'japonais') ? H_plancher * (9/12) : H_plancher;
            
            // Calcul mathématique de la longueur de trémie nécessaire pour l'échappée choisie
            let rawTremieL = stairL - ((Z_bottom - echappee) * flightRun / flightH);
            rawTremieL += 6; // Marge d'aisance de 6cm
            const tremieL = Math.min(stairL, Math.max(stairW, Math.round(rawTremieL)));

            const stairX_start = Y_chem; 
            const stairX_end = Y_chem + stairL; 
            const tremieX_end = stairX_start + tremieL; 

            // Seul le bateau et le rabattable ont un palier "plein" (structural) à l'arrivée
            const palierW = (stairType === 'bateau' || stairType === 'rabattable') ? stairW : 0;
            const tremieX_start = stairX_start + palierW;
            const tremieHoleL = tremieL - palierW;

            // --- Mezzanine ---
            const p_w = 10.0; // Largeur poutre 100mm
            const s_w = 7.3; 
            const Y_poutreArriere = -p_w; 
            const Y_poutreAvant = mezzDepth - p_w; 

            // --- CALCUL DE COLLISION TOITURE ---
            const penteToit = (443 - 85) / (428 - 73); 
            const yCollisionToit = 73 + (443 - H_plancher) / penteToit; 

            // ==========================================
            // RENDU 1 : VUE DE DESSUS (PLAN ZOOMÉ)
            // ==========================================
            const renderTopView = () => {
                const isBedHorizontal = mezzDepth < 200;
                const bedW = isBedHorizontal ? 200 : 160;
                const bedH = isBedHorizontal ? 160 : 200;
                const bedX = L_X - bedW - 10;
                const bedY = Math.max(0, mezzDepth - bedH - p_w); 
                const isBedOverlapping = bedX < tremieX_end;
                const cutY = yCollisionToit + 30;

                return (
                <svg viewBox={`-40 -60 500 ${cutY + 50}`} className="w-full h-full drop-shadow-sm">
                <defs>
                    <pattern id="netPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                        <line x1="0" y1="0" x2="0" y2="12" stroke="#64748b" strokeWidth="0.8" opacity="0.6" />
                        <line x1="0" y1="0" x2="12" y2="0" stroke="#64748b" strokeWidth="0.8" opacity="0.6" />
                    </pattern>
                </defs>
                
                {/* Murs */}
                <rect x="-10" y="0" width="10" height={cutY} fill="#cbd5e1" stroke="#94a3b8" />
                <rect x={L_X} y="0" width="10" height={cutY} fill="#cbd5e1" stroke="#94a3b8" />
                <rect x="-10" y="-10" width={L_X+20} height="10" fill="#cbd5e1" stroke="#94a3b8" />
                
                {/* Ligne de coupe */}
                <path d={`M -15 ${cutY} Q ${L_X/4} ${cutY+10} ${L_X/2} ${cutY} T ${L_X+15} ${cutY}`} fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="6,4" />

                {/* Fenêtre */}
                <g onMouseEnter={() => setActiveElement('caisson')} onMouseLeave={() => setActiveElement(null)}>
                    <rect x={L_X - 4} y="0" width="12" height="150" fill="#bfdbfe" stroke="#3b82f6" strokeWidth="2" />
                    <text x={L_X - 15} y="75" textAnchor="middle" fill="#2563eb" fontSize="10" fontWeight="bold" transform={`rotate(-90, ${L_X - 15}, 75)`}>FENÊTRE</text>
                </g>

                {/* FILET */}
                <g onMouseEnter={() => setActiveElement('filet')} onMouseLeave={() => setActiveElement(null)} className="cursor-pointer transition-opacity duration-300">
                    <rect x="0" y={mezzDepth} width={L_X} height={yCollisionToit - mezzDepth} fill="url(#netPattern)" opacity={activeElement === 'filet' ? 1 : 0.7} />
                    <rect x="0" y={mezzDepth} width={L_X} height={yCollisionToit - mezzDepth} fill="none" stroke="#64748b" strokeWidth="3" strokeDasharray="6,6" />
                    <text x={L_X/2} y={mezzDepth + (yCollisionToit - mezzDepth)/2} textAnchor="middle" fill="#334155" fontSize="12" fontWeight="bold" opacity="0.9">FILET D'HABITATION</text>
                </g>

                {/* Ligne de Collision Toit */}
                <g onMouseEnter={() => setActiveElement('collision')} onMouseLeave={() => setActiveElement(null)}>
                    <line x1="0" y1={yCollisionToit} x2={L_X} y2={yCollisionToit} stroke={activeElement === 'collision' ? '#dc2626' : '#ef4444'} strokeWidth={activeElement === 'collision' ? "3" : "2"} strokeDasharray="8,4" className="transition-all duration-300" />
                    <text x={L_X/2} y={yCollisionToit + 12} textAnchor="middle" fill={activeElement === 'collision' ? '#dc2626' : '#ef4444'} fontSize="10" fontWeight="bold" className="transition-all duration-300">JONCTION MUR/TOIT (~{Math.round(yCollisionToit)} cm)</text>
                </g>

                {/* Cheminée */}
                <rect x="0" y="0" width={Y_chem} height={Y_chem} fill="#94a3b8" stroke="#64748b" />
                <text x={Y_chem/2} y={Y_chem/2+4} textAnchor="middle" fill="#fff" fontSize="10" fontWeight="bold">CH.</text>

                {/* Porte */}
                <rect x="-6" y={Y_chem} width="6" height={Y_porte} fill="#cbd5e1" />
                <path d={`M 0 ${Y_chem} A ${Y_porte} ${Y_porte} 0 0 0 -${Y_porte} ${Y_chem + Y_porte} L 0 ${Y_chem + Y_porte} Z`} fill="#e2e8f0" stroke="#94a3b8" strokeDasharray="4,4" />

                {/* Faîtière */}
                <line x1="0" y1={Y_faitiere} x2={L_X} y2={Y_faitiere} stroke="#3b82f6" strokeWidth="2" strokeDasharray="5,5" />

                {/* Structure Bois Principale (CAISSON) */}
                <g onMouseEnter={() => setActiveElement('caisson')} onMouseLeave={() => setActiveElement(null)} className="transition-opacity duration-300 cursor-pointer" opacity={activeElement === 'caisson' ? 1 : 0.9}>
                    <rect x="-10" y={Y_poutreArriere} width={L_X+20} height={p_w} fill="#c2410c" stroke="#7c2d12" strokeWidth="1.5" />
                    <text x={L_X/2} y={Y_poutreArriere + 7} textAnchor="middle" fill="#fff" fontSize="8" fontWeight="bold">CLOISON & POUTRE CONFONDUES</text>
                    <rect x="0" y={Y_poutreAvant} width={L_X} height={p_w} fill="#c2410c" stroke="#7c2d12" strokeWidth="1.5" />
                </g>

                {/* Trémie Dessus (Vide) */}
                <g onMouseEnter={() => setActiveElement('tremie')} onMouseLeave={() => setActiveElement(null)} className="transition-all duration-300 cursor-pointer">
                    <rect x={tremieX_start} y={0} width={tremieHoleL} height={stairW} fill="none" stroke={activeElement === 'tremie' ? '#dc2626' : '#ef4444'} strokeWidth={activeElement === 'tremie' ? "3" : "2"} strokeDasharray="4,4" />
                    <text x={tremieX_start + tremieHoleL/2} y={stairW/2 + 5} textAnchor="middle" fill="#ef4444" fontSize="12" fontWeight="bold">TRÉMIE</text>
                </g>

                {/* ESCALIER VISUEL */}
                <g onMouseEnter={() => setActiveElement('diff')} onMouseLeave={() => setActiveElement(null)} opacity={activeElement === 'diff' || !activeElement ? 1 : 0.4} className="transition-all duration-500 cursor-pointer">
                    <rect x={stairX_start} y="0" width={stairL} height={stairW} fill="#fef3c7" stroke="#d97706" strokeWidth="1" />
                    
                    {stairType === 'classique' && (
                        <g>
                            <rect x={stairX_start} y="0" width={stairW} height={stairW} fill="#fcd34d" stroke="#d97706" strokeWidth="2" />
                            <path d={`M ${stairX_start+stairW} 0 L ${stairX_start+stairW} ${stairW} L ${stairX_start} ${stairW} Z`} fill="#f59e0b" stroke="#d97706" />
                            {Array.from({length: 10}).map((_, i) => (
                                <line key={`d-${i}`} x1={stairX_start + stairW + ((stairL-stairW)/10)*i} y1="0" x2={stairX_start + stairW + ((stairL-stairW)/10)*i} y2={stairW} stroke="#d97706" />
                            ))}
                            <path d={`M ${stairX_end - 20} 35 L ${stairX_start + 35} 35 L ${stairX_start + 35} 60`} fill="none" stroke="#1e293b" strokeWidth="2" />
                            <polygon points={`${stairX_start+30},55 ${stairX_start+35},65 ${stairX_start+40},55`} fill="#1e293b" />
                        </g>
                    )}
                    {stairType === 'japonais' && (
                        <g>
                            <rect x={stairX_start} y="0" width={stairW} height={stairW} fill="#fcd34d" stroke="#b45309" strokeWidth="2" />
                            <path d={`M ${stairX_start+stairW} 0 L ${stairX_start+stairW} ${stairW} L ${stairX_start} ${stairW} Z`} fill="#f59e0b" stroke="#b45309" />
                            {Array.from({length: 10}).map((_, i) => {
                                const stepRun = (stairL - stairW) / 10;
                                return <rect key={`pj-${i}`} x={stairX_start + stairW + stepRun*i} y={i % 2 === 0 ? 0 : stairW/2} width={stepRun} height={stairW/2} fill="#fcd34d" stroke="#b45309" strokeWidth="0.5" />;
                            })}
                            <path d={`M ${stairX_end - 15} ${stairW/2} L ${stairX_start + 30} ${stairW/2} L ${stairX_start + 30} ${stairW + 15}`} fill="none" stroke="#1e293b" strokeWidth="2" />
                            <polygon points={`${stairX_start+25},${stairW+10} ${stairX_start+30},${stairW+20} ${stairX_start+35},${stairW+10}`} fill="#1e293b" />
                        </g>
                    )}
                    {(stairType === 'bateau' || stairType === 'rabattable') && (
                        <g>
                            <rect x={stairX_start} y="0" width={stairW} height={stairW} fill="#fcd34d" stroke="#b45309" strokeWidth="2" />
                            <text x={stairX_start + stairW/2} y={stairW/2 + 4} textAnchor="middle" fill="#92400e" fontSize="10" fontWeight="bold">PALIER</text>
                            {Array.from({length: 10}).map((_, i) => {
                                const stepRun = (stairL - stairW) / 10;
                                return <rect key={`bat-${i}`} x={stairX_start + stairW + stepRun*i} y="0" width={stepRun} height={stairW} fill="#fcd34d" stroke="#b45309" strokeWidth="0.5" />;
                            })}
                            {/* Rampes uniquement sur bateau */}
                            {stairType === 'bateau' && <rect x={stairX_start + stairW} y="0" width="8" height={stairW} fill="#94a3b8" />}
                            <path d={`M ${stairX_end - 15} ${stairW/2} L ${stairX_start + 26} ${stairW/2} L ${stairX_start + 26} ${stairW + 15}`} fill="none" stroke="#1e293b" strokeWidth="2" />
                            <polygon points={`${stairX_start+21},${stairW+10} ${stairX_start+26},${stairW+20} ${stairX_start+31},${stairW+10}`} fill="#1e293b" />
                        </g>
                    )}
                </g>

                {/* Différence Recul / Trémie */}
                <g opacity={activeElement === 'diff' ? 1 : 0} className="transition-opacity">
                    <rect x={tremieX_end} y="-5" width={stairX_end - tremieX_end} height={stairW + 10} fill="none" stroke="#3b82f6" strokeWidth="2" strokeDasharray="4,4" className="transition-all duration-500" />
                </g>

                {/* Solivettes */}
                <g opacity={activeElement === 'lit' ? 0.3 : 1} className="transition-opacity">
                    {Array.from({length: 12}).map((_, i) => {
                        const x = stairX_start + 15 + i*40;
                        if (x >= tremieX_start && x < tremieX_end) return <rect key={`sc-${x}`} x={x} y={stairW + s_w} width={s_w} height={Y_poutreAvant - (stairW + s_w)} fill="#d97706" stroke="#92400e" strokeWidth="1" />;
                        else if (x >= 0 && x < L_X - s_w) return <rect key={`sp-${x}`} x={x} y={0} width={s_w} height={Y_poutreAvant} fill="#d97706" stroke="#92400e" strokeWidth="1" />;
                        return null;
                    })}
                </g>

                {/* Lit */}
                <g onMouseEnter={() => setActiveElement('lit')} onMouseLeave={() => setActiveElement(null)} opacity={activeElement === 'lit' ? 1 : 0.6} className="cursor-pointer transition-opacity duration-300">
                    <rect x={bedX} y={bedY} width={bedW} height={bedH} rx="4" fill={isBedOverlapping ? "#fef2f2" : "#f8fafc"} stroke={isBedOverlapping ? "#ef4444" : "#cbd5e1"} strokeWidth="2" />
                    <rect x={isBedHorizontal ? bedX : bedX} y={isBedHorizontal ? bedY : bedY + 50} width={isBedHorizontal ? bedW - 50 : bedW} height={isBedHorizontal ? bedH : bedH - 50} rx="4" fill={isBedOverlapping ? "#fecaca" : "#bfdbfe"} stroke={isBedOverlapping ? "#f87171" : "#93c5fd"} strokeWidth="2" />
                    <rect x={isBedHorizontal ? bedX + bedW - 35 : bedX + 30} y={isBedHorizontal ? bedY + 30 : bedY + 15} width={isBedHorizontal ? 20 : 40} height={isBedHorizontal ? 40 : 20} rx="4" fill="#fff" stroke="#cbd5e1" strokeWidth="1" />
                    <rect x={isBedHorizontal ? bedX + bedW - 35 : bedX + 90} y={isBedHorizontal ? bedY + 90 : bedY + 15} width={isBedHorizontal ? 20 : 40} height={isBedHorizontal ? 40 : 20} rx="4" fill="#fff" stroke="#cbd5e1" strokeWidth="1" />
                    <text x={bedX + bedW/2} y={bedY + bedH/2} textAnchor="middle" fill={isBedOverlapping ? "#ef4444" : "#1e3a8a"} fontSize="12" fontWeight="bold" transform={isBedHorizontal ? `rotate(-90, ${bedX + bedW/2}, ${bedY + bedH/2})` : ""}>LIT 160x200</text>
                    {isBedOverlapping && <text x={bedX + bedW/2} y={bedY + bedH/2 + 20} textAnchor="middle" fill="#ef4444" fontSize="10" fontWeight="bold" transform={isBedHorizontal ? `rotate(-90, ${bedX + bedW/2}, ${bedY + bedH/2})` : ""}>⚠️ DANGER</text>}
                </g>

                {/* COTES HORIZONTALES (EN HAUT DU PLAN) */}
                <line x1="0" y1="-25" x2={Y_chem} y2="-25" stroke="#0ea5e9" strokeWidth="1.5" />
                <line x1={Y_chem} y1="-30" x2={Y_chem} y2="-20" stroke="#0ea5e9" strokeWidth="1.5" />
                <text x={Y_chem/2} y="-15" textAnchor="middle" fill="#0ea5e9" fontSize="10" fontWeight="bold">58</text>

                {palierW > 0 && (
                    <g className="transition-all duration-500">
                        <line x1={Y_chem} y1="-25" x2={tremieX_start} y2="-25" stroke="#f59e0b" strokeWidth="1.5" />
                        <line x1={tremieX_start} y1="-30" x2={tremieX_start} y2="-20" stroke="#f59e0b" strokeWidth="1.5" />
                        <text x={Y_chem + palierW/2} y="-15" textAnchor="middle" fill="#d97706" fontSize="10" fontWeight="bold">Palier {palierW}</text>
                    </g>
                )}

                <line x1={tremieX_start} y1="-25" x2={tremieX_end} y2="-25" stroke="#ef4444" strokeWidth="1.5" className="transition-all duration-500" />
                <line x1={tremieX_end} y1="-30" x2={tremieX_end} y2="-20" stroke="#ef4444" strokeWidth="1.5" className="transition-all duration-500" />
                <text x={tremieX_start + tremieHoleL/2} y="-15" textAnchor="middle" fill="#ef4444" fontSize="10" fontWeight="bold" className="transition-all duration-500">{tremieHoleL} (Trémie)</text>

                <line x1={tremieX_end} y1="-25" x2={L_X} y2="-25" stroke="#10b981" strokeWidth="1.5" className="transition-all duration-500" />
                <text x={tremieX_end + (L_X - tremieX_end)/2} y="-15" textAnchor="middle" fill="#10b981" fontSize="10" fontWeight="bold" className="transition-all duration-500">{L_X - tremieX_end} (Libre)</text>

                {/* Ligne limite Pièce (Coupée) */}
                <line x1={L_X + 25} y1="0" x2={L_X + 25} y2={cutY} stroke="#475569" strokeWidth="1" strokeDasharray="4,2" />
                <line x1={L_X + 20} y1="0" x2={L_X + 30} y2="0" stroke="#475569" strokeWidth="1" />
                <text x={L_X + 35} y={cutY/2} textAnchor="middle" fill="#475569" fontSize="10" transform={`rotate(90, ${L_X + 35}, ${cutY/2})`}>Pièce totale : 428 cm</text>
                </svg>
                );
            };

            // ==========================================
            // RENDU 2 : VUE EN COUPE (ÉLÉVATION)
            // ==========================================
            const renderCoupeView = () => {
                const svgW = 600; const svgH = 350; const padX = 40; const padZ = 40;
                const scaleX = (svgW - padX * 2) / L_X; const scaleZ = (svgH - padZ * 2) / 300;
                const trX = (x) => padX + x * scaleX; const trZ = (z) => svgH - padZ - z * scaleZ;
                const zAtTremieEdge = Math.min((stairL - tremieL) / flightRun, 1) * flightH;

                return (
                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-full drop-shadow-sm">
                    {[0, 100, 200, 235, 248, 265, 300].map(z => (
                        <g key={`gz-${z}`}>
                            <line x1={trX(0)} y1={trZ(z)} x2={trX(L_X)} y2={trZ(z)} stroke="#e2e8f0" strokeDasharray="2,2" />
                            <text x={trX(0)-5} y={trZ(z)+4} textAnchor="end" fill={(z===235||z===248||z===265) ? "#b45309" : "#94a3b8"} fontSize="9">{z}</text>
                        </g>
                    ))}
                    <line x1={trX(0)} y1={trZ(300)} x2={trX(L_X)} y2={trZ(300)} stroke="#3b82f6" strokeWidth="2" strokeDasharray="4,4" />
                    
                    {/* Poutre Arrière Caisson */}
                    <g onMouseEnter={() => setActiveElement('caisson')} onMouseLeave={() => setActiveElement(null)} className="cursor-pointer">
                        <rect x={trX(0)} y={trZ(Z_top_poutre)} width={trX(L_X)-trX(0)} height={trZ(Z_bottom)-trZ(Z_top_poutre)} fill="#c2410c" opacity={activeElement === 'caisson' ? "0.6" : "0.4"} className="transition-all duration-300"/>
                    </g>
                    
                    <rect x={trX(0)} y={trZ(300)} width={trX(58)-trX(0)} height={trZ(0)-trZ(300)} fill="#94a3b8" stroke="#64748b" />
                    
                    {/* Fenêtre */}
                    <line x1={trX(L_X)} y1={trZ(85)} x2={trX(L_X)} y2={trZ(235)} stroke="#60a5fa" strokeWidth="8" strokeLinecap="square" />
                    
                    {/* Plancher Caisson */}
                    <rect x={trX(tremieX_end)} y={trZ(H_plancher)} width={trX(L_X)-trX(tremieX_end)} height={trZ(Z_bottom)-trZ(H_plancher)} fill="#f59e0b" stroke="#b45309" strokeWidth="2" />
                    {palierW > 0 && <rect x={trX(stairX_start)} y={trZ(H_plancher)} width={trX(tremieX_start)-trX(stairX_start)} height={trZ(Z_bottom)-trZ(H_plancher)} fill="#fcd34d" stroke="#b45309" strokeWidth="2" />}
                    
                    {/* Zone de vide (Trémie) */}
                    <g onMouseEnter={() => setActiveElement('tremie')} onMouseLeave={() => setActiveElement(null)} className="cursor-pointer">
                        <rect x={trX(tremieX_start)} y={trZ(Z_top_poutre)} width={trX(tremieX_end)-trX(tremieX_start)} height={trZ(Z_bottom)-trZ(Z_top_poutre)} fill="none" stroke={activeElement === 'tremie' ? '#dc2626' : '#ef4444'} strokeWidth={activeElement === 'tremie' ? "3" : "2"} strokeDasharray="4,4" />
                    </g>

                    {/* Escaliers */}
                    <g onMouseEnter={() => setActiveElement('diff')} onMouseLeave={() => setActiveElement(null)} opacity={activeElement === 'diff' || !activeElement ? 1 : 0.3} className="transition-opacity cursor-pointer">
                        {stairType === 'classique' || stairType === 'japonais' ? (
                            <g className="transition-all duration-500">
                                <line x1={trX(stairX_end)} y1={trZ(0)} x2={trX(stairX_start + stairW)} y2={trZ(H_plancher * 9/12)} stroke="#fcd34d" strokeWidth="8" />
                                {Array.from({length: 9}).map((_, i) => {
                                    const px1 = stairX_end - ((stairL - stairW)/9)*i;
                                    const px2 = stairX_end - ((stairL - stairW)/9)*(i+1);
                                    const pz1 = (H_plancher * 9/12 / 9)*i;
                                    const pz2 = (H_plancher * 9/12 / 9)*(i+1);
                                    return (
                                        <g key={`step-w-${i}`}>
                                            <line x1={trX(px1)} y1={trZ(pz1)} x2={trX(px2)} y2={trZ(pz1)} stroke={stairType === 'classique' ? "#d97706" : "#b45309"} strokeWidth="2" />
                                            <line x1={trX(px2)} y1={trZ(pz1)} x2={trX(px2)} y2={trZ(pz2)} stroke={stairType === 'classique' ? "#d97706" : "#b45309"} strokeWidth="2" />
                                        </g>
                                    );
                                })}
                                <rect x={trX(stairX_start)} y={trZ(H_plancher)} width={trX(stairX_start + stairW) - trX(stairX_start)} height={trZ(H_plancher * 9/12) - trZ(H_plancher)} fill="#fcd34d" stroke={stairType === 'classique' ? "#d97706" : "#b45309"} strokeWidth="2" />
                            </g>
                        ) : (
                            <g className="transition-all duration-500">
                                <line x1={trX(stairX_end)} y1={trZ(0)} x2={trX(stairX_start + stairW)} y2={trZ(H_plancher)} stroke="#fcd34d" strokeWidth="8" />
                                {Array.from({length: 12}).map((_, i) => {
                                    const px1 = stairX_end - ((stairL - stairW)/12)*i;
                                    const px2 = stairX_end - ((stairL - stairW)/12)*(i+1);
                                    const pz1 = (H_plancher/12)*i;
                                    const pz2 = (H_plancher/12)*(i+1);
                                    return (
                                        <g key={`step-o-${i}`}>
                                            <line x1={trX(px1)} y1={trZ(pz1)} x2={trX(px2)} y2={trZ(pz1)} stroke="#b45309" strokeWidth="2" />
                                            <line x1={trX(px2)} y1={trZ(pz1)} x2={trX(px2)} y2={trZ(pz2)} stroke="#b45309" strokeWidth="2" />
                                        </g>
                                    );
                                })}
                                {/* Rampe Bateau Uniquement */}
                                {stairType === 'bateau' && (
                                    <line x1={trX(stairX_start + stairW)} y1={trZ(245)} x2={trX(stairX_start + stairW - 15)} y2={trZ(245 + 81)} stroke="#94a3b8" strokeWidth="4" strokeLinecap="round" />
                                )}
                            </g>
                        )}
                    </g>
                    
                    {/* Échappée */}
                    <g onMouseEnter={() => setActiveElement('echappee')} onMouseLeave={() => setActiveElement(null)} className="cursor-pointer transition-opacity duration-300" opacity={activeElement === 'echappee' || !activeElement ? 1 : 0.3}>
                        <line x1={trX(tremieX_end)} y1={trZ(Z_bottom)} x2={trX(tremieX_end)} y2={trZ(zAtTremieEdge)} stroke="#f43f5e" strokeWidth="4" />
                        <line x1={trX(tremieX_end)-10} y1={trZ(Z_bottom)} x2={trX(tremieX_end)+10} y2={trZ(Z_bottom)} stroke="#f43f5e" strokeWidth="3" />
                        <line x1={trX(tremieX_end)-10} y1={trZ(zAtTremieEdge)} x2={trX(tremieX_end)+10} y2={trZ(zAtTremieEdge)} stroke="#f43f5e" strokeWidth="3" />
                        <text x={trX(tremieX_end) + 10} y={trZ(zAtTremieEdge + (Z_bottom-zAtTremieEdge)/2)} fill="#e11d48" fontSize="12" fontWeight="bold">Échappée {echappee}cm</text>
                    </g>

                    {/* Lignes de Cotes DZ / Recul (En bas) */}
                    <g opacity={activeElement === 'diff' || !activeElement ? 1 : 0.3} className="transition-opacity">
                        <line x1={trX(stairX_end)} y1={trZ(0)} x2={trX(stairX_end)} y2={trZ(-15)} stroke="#3b82f6" strokeWidth="1" className="transition-all duration-500" />
                        
                        {(stairType === 'bateau' || stairType === 'rabattable') && (
                            <line x1={trX(stairX_start + stairW)} y1={trZ(0)} x2={trX(stairX_start + stairW)} y2={trZ(-25)} stroke="#f59e0b" strokeWidth="1" strokeDasharray="2,2" className="transition-all duration-500" />
                        )}
                        
                        <line x1={trX(stairX_start)} y1={trZ(0)} x2={trX(stairX_start)} y2={trZ(-25)} stroke="#f59e0b" strokeWidth="1" className="transition-all duration-500" />
                        
                        {(stairType === 'bateau' || stairType === 'rabattable') ? (
                            <>
                                <line x1={trX(stairX_start)} y1={trZ(-20)} x2={trX(stairX_start + stairW)} y2={trZ(-20)} stroke="#f59e0b" strokeWidth="2" className="transition-all duration-500" />
                                <text x={trX(stairX_start + stairW/2)} y={trZ(-25)} textAnchor="middle" fill="#d97706" fontSize="10" fontWeight="bold">Palier {stairW}cm</text>
                                
                                <line x1={trX(stairX_start + stairW)} y1={trZ(-10)} x2={trX(stairX_end)} y2={trZ(-10)} stroke="#3b82f6" strokeWidth="2" className="transition-all duration-500" />
                                <text x={trX(stairX_start + stairW + (stairL-stairW)/2)} y={trZ(-15)} textAnchor="middle" fill="#3b82f6" fontSize="10" fontWeight="bold">DZ Échelle : {stairL-stairW}cm</text>
                            </>
                        ) : (
                            <>
                                <line x1={trX(stairX_start)} y1={trZ(-10)} x2={trX(stairX_end)} y2={trZ(-10)} stroke="#3b82f6" strokeWidth="2" className="transition-all duration-500" />
                                <text x={trX(stairX_start + stairL/2)} y={trZ(-15)} textAnchor="middle" fill="#3b82f6" fontSize="10" fontWeight="bold">Recul Total : {stairL} cm</text>
                            </>
                        )}
                    </g>

                    {/* COTES HORIZONTALES (EN BAS DE LA COUPE) */}
                    <line x1={trX(0)} y1={trZ(-30)} x2={trX(L_X)} y2={trZ(-30)} stroke="#475569" strokeWidth="1" />
                    <line x1={trX(58)} y1={trZ(-25)} x2={trX(58)} y2={trZ(-35)} stroke="#475569" strokeWidth="1" />
                    {palierW > 0 && <line x1={trX(tremieX_start)} y1={trZ(-25)} x2={trX(tremieX_start)} y2={trZ(-35)} stroke="#475569" strokeWidth="1" className="transition-all duration-500" />}
                    <line x1={trX(tremieX_end)} y1={trZ(-25)} x2={trX(tremieX_end)} y2={trZ(-35)} stroke="#475569" strokeWidth="1" className="transition-all duration-500" />
                    
                    <text x={trX(29)} y={trZ(-40)} textAnchor="middle" fill="#475569" fontSize="10">58</text>
                    {palierW > 0 && <text x={trX(stairX_start + palierW/2)} y={trZ(-40)} textAnchor="middle" fill="#d97706" fontSize="10" fontWeight="bold" className="transition-all duration-500">Palier {palierW}</text>}
                    <text x={trX(tremieX_start + tremieHoleL/2)} y={trZ(-40)} textAnchor="middle" fill="#ef4444" fontSize="12" fontWeight="bold" className="transition-all duration-500">{tremieHoleL} (Trémie)</text>
                    <text x={trX(tremieX_end + (L_X-tremieX_end)/2)} y={trZ(-40)} textAnchor="middle" fill="#10b981" fontSize="12" fontWeight="bold" className="transition-all duration-500">{L_X - tremieX_end} (Libre)</text>

                </svg>
                );
            };

            return (
                <div className="w-full flex flex-col items-center">
                <div className="max-w-[1600px] w-full bg-white sm:rounded-2xl shadow-2xl border border-slate-200 overflow-clip">
                    
                    {/* BARRE D'OUTILS SUR UNE LIGNE (FIXE) */}
                    <div className="sticky top-0 z-50 bg-slate-900 border-b-4 border-emerald-500 shadow-md">
                        <div className="flex flex-row items-center justify-center p-2 sm:p-3 gap-2 sm:gap-6 overflow-x-auto no-scrollbar">
                            
                            {/* 1. Profondeur */}
                            <div className="flex flex-row items-center gap-3 bg-slate-800 rounded-xl p-1.5 border border-purple-500/40 shadow-inner flex-shrink-0">
                                <div className="text-purple-400 flex flex-col items-center min-w-[70px]">
                                    <i className="fa-solid fa-ruler-horizontal text-lg mb-1"></i>
                                    <span className="text-[9px] font-black uppercase tracking-widest mt-1">Profondeur</span>
                                </div>
                                <div className="flex gap-1.5">
                                    {[160, 180, 200].map(val => (
                                        <button key={`d-${val}`} onClick={() => setMezzDepth(val)} className={`px-3 py-2 rounded-lg font-bold text-xs transition-all ${mezzDepth === val ? 'bg-purple-500 text-white' : 'bg-slate-700 text-slate-400'}`}>{val}</button>
                                    ))}
                                </div>
                            </div>

                            {/* 2. Vue */}
                            <div className="flex flex-row items-center gap-3 bg-slate-800 rounded-xl p-1.5 border border-sky-500/40 shadow-inner flex-shrink-0">
                                <div className="text-sky-400 flex flex-col items-center min-w-[60px]">
                                    <i className="fa-solid fa-eye text-lg mb-1"></i>
                                    <span className="text-[9px] font-black uppercase tracking-widest mt-1">Vue</span>
                                </div>
                                <div className="flex gap-1.5">
                                    <button onClick={() => setViewMode('top')} className={`px-3 py-2 rounded-lg font-bold text-xs ${viewMode === 'top' ? 'bg-sky-500 text-white' : 'bg-slate-700 text-slate-400'}`}>Dessus</button>
                                    <button onClick={() => setViewMode('coupe')} className={`px-3 py-2 rounded-lg font-bold text-xs ${viewMode === 'coupe' ? 'bg-sky-500 text-white' : 'bg-slate-700 text-slate-400'}`}>Coupe</button>
                                </div>
                            </div>

                            {/* 3. Type d'Échelle */}
                            <div className="flex flex-row items-center gap-3 bg-slate-800 rounded-xl p-1.5 border border-emerald-500/40 shadow-inner flex-shrink-0">
                                <div className="text-emerald-400 flex flex-col items-center min-w-[80px]">
                                    <i className="fa-solid fa-stairs text-lg mb-1"></i>
                                    <span className="text-[9px] font-black uppercase tracking-widest leading-none mt-1 text-center">Type<br/>d'échelle</span>
                                </div>
                                <div className="flex gap-1.5">
                                    <button onClick={() => setStairType('classique')} className={`px-2 py-1 rounded-lg font-bold text-[10px] flex flex-col items-center leading-tight ${stairType === 'classique' ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                        <span>Meunier 1/4</span><span className="font-normal opacity-70">65cm</span>
                                    </button>
                                    <button onClick={() => setStairType('japonais')} className={`px-2 py-1 rounded-lg font-bold text-[10px] flex flex-col items-center leading-tight ${stairType === 'japonais' ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                        <span>Japonais</span><span className="font-normal opacity-70">60cm</span>
                                    </button>
                                    <button onClick={() => setStairType('bateau')} className={`px-2 py-1 rounded-lg font-bold text-[10px] flex flex-col items-center leading-tight ${stairType === 'bateau' ? 'bg-blue-500 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                        <span>Bateau</span><span className="font-normal opacity-70">52cm</span>
                                    </button>
                                    <button onClick={() => setStairType('rabattable')} className={`px-2 py-1 rounded-lg font-bold text-[10px] flex flex-col items-center leading-tight ${stairType === 'rabattable' ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                        <span>Rabattable</span><span className="font-normal opacity-70">60cm</span>
                                    </button>
                                </div>
                            </div>

                            {/* 4. Échappée */}
                            <div className="flex flex-row items-center gap-4 bg-slate-800 rounded-xl p-1.5 border border-rose-500/40 shadow-inner min-w-[260px]">
                                <div className="text-rose-400 flex flex-col items-center min-w-[70px]">
                                    <i className="fa-solid fa-arrows-up-down text-lg mb-1"></i>
                                    <span className="text-[9px] font-black uppercase tracking-widest mt-1">Échappée</span>
                                </div>
                                <div className="flex-1 flex items-center gap-3 px-2">
                                    <input type="range" min="180" max="210" step="1" value={echappee} onChange={(e) => setEchappee(Number(e.target.value))} className="w-full accent-rose-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                                    <span className="text-rose-100 font-bold text-sm min-w-[35px]">{echappee}</span>
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* CONTENU PRINCIPAL */}
                    <div className="p-4 md:p-8 flex flex-col lg:flex-row gap-6 lg:gap-10">
                        
                        {/* Zone Graphique */}
                        <div className="flex-1 flex flex-col items-center w-full">
                            <div className="relative w-full aspect-[4/3] lg:aspect-auto lg:h-[75vh] bg-slate-50 rounded-2xl p-4 border border-slate-200 shadow-inner flex items-center justify-center">
                                {viewMode === 'top' ? renderTopView() : renderCoupeView()}
                            </div>
                        </div>

                        {/* COLONNE DE LÉGENDES */}
                        <div className="w-full lg:w-[420px] flex flex-col gap-4 lg:overflow-y-auto lg:max-h-[75vh] pr-1 no-scrollbar">
                            
                            {/* Dimensions */}
                            <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'dimensions' ? 'border-purple-500 bg-purple-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('dimensions')} onMouseLeave={() => setActiveElement(null)}>
                                <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-ruler-combined text-purple-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">Dimensions Générales</h3></div>
                                <div className="text-xs text-slate-600 grid grid-cols-2 gap-2">
                                    <div><strong>Pièce :</strong> 415 x 428 cm</div>
                                    <div><strong>Mezzanine :</strong> 415 x {mezzDepth} cm</div>
                                    <div><strong>H. Faîtière :</strong> 4m43</div>
                                    <div><strong>H. Plancher :</strong> 2m48</div>
                                </div>
                            </div>

                            {/* Caisson */}
                            <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'caisson' ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('caisson')} onMouseLeave={() => setActiveElement(null)}>
                                <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-check text-emerald-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">Conception Caisson</h3></div>
                                <p className="text-[11px] text-slate-600 leading-relaxed">
                                    <strong>La fenêtre est préservée :</strong> Le dessous de la structure est calé à 235 cm. Les poutres maîtresses (100x300) grimpent jusqu'à 265 cm, tandis que le plancher se situe à 248 cm. Cela génère un <strong>rebord protecteur de 17 cm</strong> idéal pour stabiliser le matelas.
                                </p>
                            </div>

                            {/* Filet (Visible uniquement en vue de dessus) */}
                            {viewMode === 'top' && (
                                <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'filet' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('filet')} onMouseLeave={() => setActiveElement(null)}>
                                    <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-network-wired text-blue-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">Filet d'Habitation</h3></div>
                                    <p className="text-[11px] text-slate-600 leading-relaxed">
                                        Zone de détente tendue entre la poutre de bordure (à {mezzDepth} cm) et la jonction du toit (~{Math.round(yCollisionToit)} cm). Cette solution maximise la lumière naturelle venant de la fenêtre pignon sans assombrir le bas.
                                    </p>
                                </div>
                            )}

                            {/* Collision Toit (Visible uniquement en vue de dessus) */}
                            {viewMode === 'top' && (
                                <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'collision' ? 'border-red-500 bg-red-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('collision')} onMouseLeave={() => setActiveElement(null)}>
                                    <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-exclamation-triangle text-red-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">Limite Maximale (Toit)</h3></div>
                                    <p className="text-[11px] text-slate-600 leading-relaxed">
                                        La ligne rouge pointillée (à ~{Math.round(yCollisionToit)} cm) indique l'endroit exact où le plancher (à 2m48 de hauteur) vient s'encastrer dans la pente du toit. Au-delà, l'aménagement est impossible.
                                    </p>
                                </div>
                            )}

                            {/* Échappée (Visible uniquement en vue en coupe) */}
                            {viewMode === 'coupe' && (
                                <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'echappee' ? 'border-rose-500 bg-rose-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('echappee')} onMouseLeave={() => setActiveElement(null)}>
                                    <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-arrows-up-down text-rose-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">L'Échappée ({echappee} cm)</h3></div>
                                    <p className="text-[11px] text-slate-600 leading-relaxed">
                                        C'est la distance de confort pour passer la tête ! Plus vous l'augmentez avec le curseur (ex: 210cm), plus il faut ouvrir le plafond. En la réduisant à 180cm ou 190cm, la trémie se referme beaucoup plus tôt, vous offrant plus de plancher.
                                    </p>
                                </div>
                            )}

                            {/* Trémie */}
                            <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'tremie' ? 'border-red-500 bg-red-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('tremie')} onMouseLeave={() => setActiveElement(null)}>
                                <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-compress text-red-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">Trémie Réelle : {tremieHoleL} cm</h3></div>
                                <p className="text-[11px] text-slate-600 leading-relaxed">
                                    {(stairType === 'bateau' || stairType === 'rabattable') 
                                        ? `Le palier de ${stairW}cm fait partie du plancher ! Le trou RÉEL à découper dans l'ossature ne fait donc plus que ${tremieHoleL} cm de long.`
                                        : `L'escalier ayant un 1/4 tournant composé de marches creuses, la trémie doit englober toute la zone de virage. Le trou fait la totalité de la Trémie (${tremieHoleL} cm).`}
                                </p>
                            </div>

                            {/* Recul */}
                            <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'diff' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('diff')} onMouseLeave={() => setActiveElement(null)}>
                                <div className="flex items-center gap-3 mb-2"><i className="fa-solid fa-arrows-left-right text-blue-500 text-lg"></i><h3 className="font-black text-sm uppercase text-slate-800">Recul au sol : {stairL} cm</h3></div>
                                <p className="text-[11px] text-slate-600 leading-relaxed">
                                    {(stairType === 'bateau' || stairType === 'rabattable') 
                                        ? `Recul Total = Palier (${stairW}cm) + Projection au sol de l'échelle (${stairL-stairW}cm) = ${stairL} cm d'encombrement le long du mur.`
                                        : `L'escalier 1/4 tournant à marches s'étire sur ${stairL} cm de recul au total.`}
                                </p>
                            </div>

                            {/* Lit / Circulation */}
                            <div className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${activeElement === 'lit' ? 'border-amber-500 bg-amber-50' : 'border-slate-200 bg-white'}`} onMouseEnter={() => setActiveElement('lit')} onMouseLeave={() => setActiveElement(null)}>
                                <div className="flex items-center gap-3 mb-2">
                                    {mezzDepth < 200 && (L_X - (mezzDepth < 200 ? 200 : 160) - 10) < tremieX_end ? <i className="fa-solid fa-exclamation-circle text-red-500 text-lg"></i> : <i className="fa-solid fa-bed text-amber-500 text-lg"></i>}
                                    <h3 className={`font-black text-sm uppercase ${mezzDepth < 200 && (L_X - (mezzDepth < 200 ? 200 : 160) - 10) < tremieX_end ? 'text-red-600' : 'text-slate-800'}`}>Circulation ({L_X - tremieX_end} cm)</h3>
                                </div>
                                <p className={`text-[11px] leading-relaxed ${mezzDepth < 200 && (L_X - (mezzDepth < 200 ? 200 : 160) - 10) < tremieX_end ? 'text-red-700 font-bold' : 'text-slate-600'}`}>
                                    C'est l'espace de plancher plein disponible à droite de l'escalier.<br/><br/>
                                    {mezzDepth < 200 ? 
                                        ((L_X - 200 - 10) < tremieX_end ? 
                                            "DANGER : À cette profondeur, le lit a dû être tourné. Or, la trémie s'étend trop loin et le lit se retrouve en porte-à-faux au-dessus du vide !" 
                                            : "Configuration validée : le lit a tourné pour tenir dans les " + mezzDepth + "cm, mais la trémie courte lui laisse largement la place de s'encastrer.") 
                                        : 
                                        "À 200 cm, le lit est dans son axe naturel, parfaitement calé contre le rebord de la poutre avant."}
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
